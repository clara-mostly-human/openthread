name: Build

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/openthread' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  pretty:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install -y shellcheck iwyu
        sudo bash script/install-llvm.sh
        python3 -m pip install yapf==0.43.0
        sudo snap install shfmt
        npm install prettier@2.0.4
    - name: Check
      run: |
        script/make-pretty check
        script/check-iwyu-public-header

  gcc:
    name: gcc-${{ matrix.gcc_ver }}-${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc_ver: [12]
        target: [posix-daemon]
    env:
      CC: gcc-${{ matrix.gcc_ver }}
      CXX: g++-${{ matrix.gcc_ver }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Bootstrap
      timeout-minutes: 10
      shell: bash ./script/retry {0}
      run: |
        sudo apt-get update
        case ${{ matrix.gcc_ver }} in
          11)
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            ;;
        esac
        sudo apt-get --no-install-recommends install -y gcc-${{ matrix.gcc_ver }} g++-${{ matrix.gcc_ver }} ninja-build libreadline-dev libncurses-dev
    - name: Build
      run: |
        case ${{ matrix.target }} in
          simulation-1.1)
            script/check-simulation-build 1.1
            ;;
          simulation-1.4)
            script/check-simulation-build 1.4
            ;;
          posix | posix-daemon)
            script/check-posix-build "${{ matrix.target }}"
            ;;
        esac

  macos:
    name: macos-${{ matrix.CC }}-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        CC: [clang, gcc]
        target: [posix, simulation-1.1, simulation-1.4]
        include:
          - CC: clang
            CXX: clang++
          - CC: gcc
            CXX: g++
    runs-on: macos-15
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Build
      run: |
        case ${{ matrix.target }} in
          simulation-1.1)
            script/check-simulation-build 1.1
            ;;
          simulation-1.4)
            script/check-simulation-build 1.4
            ;;
          posix)
            script/check-posix-build
            ;;
        esac
