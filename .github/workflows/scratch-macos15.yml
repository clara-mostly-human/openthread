name: scratch-macos15

on:
  push:
    branches: ['scratch/macos15-unifdef-debug']

permissions: {}

env:
  NEST_CFLAGS: >-
    -DOPENTHREAD_CONFIG_BORDER_ROUTER_ENABLE=1
    -DOPENTHREAD_CONFIG_CHANNEL_MANAGER_ENABLE=1
    -DOPENTHREAD_CONFIG_CHANNEL_MONITOR_ENABLE=1
    -DOPENTHREAD_CONFIG_DATASET_UPDATER_ENABLE=1
    -DOPENTHREAD_CONFIG_DIAG_ENABLE=1
    -DOPENTHREAD_CONFIG_JAM_DETECTION_ENABLE=1
    -DOPENTHREAD_CONFIG_MAC_FILTER_ENABLE=1
    -DOPENTHREAD_CONFIG_PING_SENDER_ENABLE=1
    -DOPENTHREAD_CONFIG_NCP_SPI_ENABLE=1
    -DOPENTHREAD_CONFIG_PLATFORM_FLASH_API_ENABLE=1
    -DOPENTHREAD_CONFIG_TMF_NETDATA_SERVICE_ENABLE=1

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: toolchain
        run: |
          set -x; set +e
          sw_vers; xcodebuild -version; uname -m; cmake --version | head -1; ninja --version
          which unifdef unifdefall cpp
          unifdef -V 2>&1 || true
          file /usr/bin/unifdef /usr/bin/unifdefall
          mkdir -p /tmp/p && cd /tmp/p
          printf '#define BAR 1\n' > bar.h
          printf '#include "bar.h"\n#if FOO\nfoo\n#endif\n#if BAR\nbar\n#endif\n#if BAZ\nbaz\n#endif\n' > u.h
          unifdef -DFOO=1 -DFOO=1 u.h; echo "unifdef dup exit=$?"
          unifdefall -I. -DFOO=1 u.h; echo "unifdefall single exit=$?"
          unifdefall -I. -DFOO=1 -DFOO=1 u.h; echo "unifdefall dup exit=$?"

      - name: generate the mbedtls config header (default simulation build)
        run: |
          set -x; set +e
          mkdir build && cd build
          CFLAGS="$NEST_CFLAGS" CXXFLAGS="$NEST_CFLAGS" cmake -GNinja -DOT_PLATFORM=simulation ..
          ninja -t commands third_party/mbedtls/openthread-mbedtls-config.h | tail -1 | tee /tmp/gen.cmd
          echo "--- duplicate -D symbols in the generation command"
          tr ' ' '\n' < /tmp/gen.cmd | sed "s/^'//; s/'\$//" | grep '^-D' | sort | uniq -d || true
          ninja -v third_party/mbedtls/openthread-mbedtls-config.h; echo "ninja exit=$?"
          H=third_party/mbedtls/openthread-mbedtls-config.h
          wc -l $H; grep -c '^#if' $H || true
          grep -n 'OPENTHREAD_CONFIG\|X509_CRT_PARSE_C\|SSL_TLS_C' $H || true

      - name: build ot-cli-ftd and inspect
        run: |
          set -x; set +e
          cd build
          ninja examples/apps/cli/ot-cli-ftd 2>&1 | grep -E 'FAILED|Undefined|referenced from|_mbedtls_|ld: ' | head -20; echo "ninja exit=${PIPESTATUS[0]}"
          X509=third_party/mbedtls/repo/library/CMakeFiles/mbedx509.dir/x509_crt.c.o
          TCP=$(ninja -t targets all | grep -o '[^ ]*cli_tcp.cpp.o' | grep 'cli-ftd' | head -1); echo "cli_tcp object: $TCP"
          echo "--- defined x509 symbols in libmbedx509.a"; nm third_party/mbedtls/repo/library/libmbedx509.a 2>/dev/null | grep -E ' T _?mbedtls_x509_crt_(init|parse)$' | sort -u
          echo "--- undefined x509/ssl refs in cli_tcp.cpp.o"; nm -u "$TCP" 2>/dev/null | grep -E 'x509_crt_init|ssl_set_hostname|ssl_conf_ca_chain' | sort -u
          echo "--- compile command of x509_crt.c"; ninja -t commands "$X509" | tail -1 | cut -c1-900
          echo "--- compile command of cli_tcp.cpp"; ninja -t commands "$TCP" | tail -1 | cut -c1-900
          echo "--- link command of ot-cli-ftd"; ninja -t commands examples/apps/cli/ot-cli-ftd | tail -1 | cut -c1-900
          echo "--- macros seen when compiling x509_crt.c"
          CMD=$(ninja -t commands "$X509" | tail -1); eval "$CMD -dM -E" && grep -E 'define (MBEDTLS_X509_CRT_PARSE_C|OPENTHREAD_CONFIG_TLS_ENABLE|OPENTHREAD_CONFIG_TCP_ENABLE|OPENTHREAD_CONFIG_COAP_SECURE_API_ENABLE|OPENTHREAD_CONFIG_BLE_TCAT_ENABLE|MBEDTLS_CONFIG_FILE)' "$X509"
          echo "--- macros seen when compiling cli_tcp.cpp"
          CMD=$(ninja -t commands "$TCP" | tail -1); eval "$CMD -dM -E" && grep -E 'define (MBEDTLS_X509_CRT_PARSE_C|OPENTHREAD_CONFIG_TLS_ENABLE|OPENTHREAD_CONFIG_TCP_ENABLE|OPENTHREAD_CONFIG_COAP_SECURE_API_ENABLE|OPENTHREAD_CONFIG_BLE_TCAT_ENABLE|MBEDTLS_CONFIG_FILE)' "$TCP"
          echo "--- which openthread-mbedtls-config.h files exist"; find . -name 'openthread-mbedtls-config.h' -o -name 'mbedtls-config.h' | head
          find "$GITHUB_WORKSPACE" -name 'openthread-mbedtls-config.h' -not -path '*/build/*' | head

  reference-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: generate the mbedtls config header (default simulation build)
        run: |
          set -x; set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq unifdef ninja-build > /dev/null
          which unifdef unifdefall; unifdef -V 2>&1 | head -2; file "$(which unifdefall)"
          mkdir -p /tmp/p && cd /tmp/p
          printf '#define BAR 1\n' > bar.h
          printf '#include "bar.h"\n#if FOO\nfoo\n#endif\n#if BAR\nbar\n#endif\n#if BAZ\nbaz\n#endif\n' > u.h
          unifdefall -I. -DFOO=1 u.h; echo "unifdefall single exit=$?"
          unifdefall -I. -DFOO=1 -DFOO=1 u.h; echo "unifdefall dup exit=$?"
          cd "$GITHUB_WORKSPACE"
          mkdir build && cd build
          CFLAGS="$NEST_CFLAGS" CXXFLAGS="$NEST_CFLAGS" cmake -GNinja -DOT_PLATFORM=simulation ..
          ninja -t commands third_party/mbedtls/openthread-mbedtls-config.h | tail -1 | tee /tmp/gen.cmd
          ninja -v third_party/mbedtls/openthread-mbedtls-config.h; echo "ninja exit=$?"
          H=third_party/mbedtls/openthread-mbedtls-config.h
          wc -l $H; grep -c '^#if' $H || true
          grep -n 'OPENTHREAD_CONFIG\|X509_CRT_PARSE_C\|SSL_TLS_C' $H || true

      - name: build ot-cli-ftd and inspect
        run: |
          set -x; set +e
          cd build
          ninja examples/apps/cli/ot-cli-ftd 2>&1 | grep -E 'FAILED|Undefined|referenced from|_mbedtls_|ld: ' | head -20; echo "ninja exit=${PIPESTATUS[0]}"
          X509=third_party/mbedtls/repo/library/CMakeFiles/mbedx509.dir/x509_crt.c.o
          TCP=$(ninja -t targets all | grep -o '[^ ]*cli_tcp.cpp.o' | grep 'cli-ftd' | head -1); echo "cli_tcp object: $TCP"
          echo "--- defined x509 symbols in libmbedx509.a"; nm third_party/mbedtls/repo/library/libmbedx509.a 2>/dev/null | grep -E ' T _?mbedtls_x509_crt_(init|parse)$' | sort -u
          echo "--- undefined x509/ssl refs in cli_tcp.cpp.o"; nm -u "$TCP" 2>/dev/null | grep -E 'x509_crt_init|ssl_set_hostname|ssl_conf_ca_chain' | sort -u
          echo "--- compile command of x509_crt.c"; ninja -t commands "$X509" | tail -1 | cut -c1-900
          echo "--- compile command of cli_tcp.cpp"; ninja -t commands "$TCP" | tail -1 | cut -c1-900
          echo "--- link command of ot-cli-ftd"; ninja -t commands examples/apps/cli/ot-cli-ftd | tail -1 | cut -c1-900
          echo "--- macros seen when compiling x509_crt.c"
          CMD=$(ninja -t commands "$X509" | tail -1); eval "$CMD -dM -E" && grep -E 'define (MBEDTLS_X509_CRT_PARSE_C|OPENTHREAD_CONFIG_TLS_ENABLE|OPENTHREAD_CONFIG_TCP_ENABLE|OPENTHREAD_CONFIG_COAP_SECURE_API_ENABLE|OPENTHREAD_CONFIG_BLE_TCAT_ENABLE|MBEDTLS_CONFIG_FILE)' "$X509"
          echo "--- macros seen when compiling cli_tcp.cpp"
          CMD=$(ninja -t commands "$TCP" | tail -1); eval "$CMD -dM -E" && grep -E 'define (MBEDTLS_X509_CRT_PARSE_C|OPENTHREAD_CONFIG_TLS_ENABLE|OPENTHREAD_CONFIG_TCP_ENABLE|OPENTHREAD_CONFIG_COAP_SECURE_API_ENABLE|OPENTHREAD_CONFIG_BLE_TCAT_ENABLE|MBEDTLS_CONFIG_FILE)' "$TCP"
          echo "--- which openthread-mbedtls-config.h files exist"; find . -name 'openthread-mbedtls-config.h' -o -name 'mbedtls-config.h' | head
          find "$GITHUB_WORKSPACE" -name 'openthread-mbedtls-config.h' -not -path '*/build/*' | head
